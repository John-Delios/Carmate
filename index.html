!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts Garage - dashboard demo</title>
<style>
  :root {
    --bg: #1c1c1e;
    --bg-deep: #0e0e10;
    --panel: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.18);
    --text: #f2f2f2;
    --muted: #9a9a9f;
    --ok: #3fe08a;
    --warn: #ffb545;
    --stop: #ff5c5c;
    --accent: #e33b2f;
    --badge: #ff5a36;
    --hdr: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif-condensed, sans-serif;
    --body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--body);
    color: var(--text);
    background: radial-gradient(ellipse 70% 55% at 62% 62%, #46464a 0%, #2a2a2d 45%, var(--bg) 70%, var(--bg-deep) 100%);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  /* ---------- top status bar ---------- */
  .topbar {
    display: flex; align-items: stretch; gap: 0;
    height: 64px; background: #0b0b0c;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }
  .topbar .cell {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 20px; border-right: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
  }
  .topbar .cell:last-child { border-right: 0; }
  .topbar .cell small { color: var(--muted); font-size: 11px; letter-spacing: .02em; }
  .topbar .cell b { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .topbar .logo {
    width: 64px; display: grid; place-items: center; font-family: var(--hdr);
    font-weight: 700; font-size: 20px; letter-spacing: -.02em;
  }
  .topbar .logo span { border: 2px solid #fff; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; }
  .topbar .grow { flex: 1; min-width: 0; }
  .topbar .vehicle { flex: 1; min-width: 0; flex-direction: row; align-items: center; gap: 14px; }
  .topbar .vehicle .thumb { width: 90px; height: 36px; flex: none; }
  .topbar .vehicle .name { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
  .topbar .vehicle .sub { color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    font-family: var(--hdr); font-weight: 700; font-size: 15px; letter-spacing: .01em;
  }
  .topbar .pill { margin-left: 8px; }
  .topbar .clock { text-align: right; }
  .topbar .clock b { font-size: 20px; }

  /* ---------- main stage ---------- */
  .stage {
    position: relative;
    display: grid;
    grid-template-columns: 420px 1fr;
    padding: 34px 40px 0;
    gap: 20px;
    min-height: 0;
  }
  .info h1 { font-family: var(--body); font-weight: 300; font-size: 34px; margin: 0 0 18px; letter-spacing: -.01em; }
  .make { display: flex; align-items: center; gap: 10px; font-family: var(--hdr); font-weight: 700; font-size: 18px; letter-spacing: .04em; }
  .flag { width: 28px; height: 18px; border-radius: 2px; background: #fff; display: inline-block; position: relative; overflow: hidden; }
  .flag.jp::after { content:""; position:absolute; inset:0; margin:auto; width:10px; height:10px; border-radius:50%; background:#bc002d; }
  .flag.cn { background: #de2910; }
  .flag.cn::after { content:"\2605"; color:#ffde00; font-size:9px; position:absolute; left:3px; top:1px; }
  .flag.kr { background: #fff; }
  .flag.kr::after { content:""; position:absolute; inset:0; margin:auto; width:9px; height:9px; border-radius:50%; background:linear-gradient(180deg,#cd2e3a 50%,#0047a0 50%); }
  .model { font-family: var(--hdr); font-weight: 700; font-size: 27px; line-height: 1.15; margin: 14px 0 6px; }
  .colour { font-family: var(--hdr); font-weight: 700; font-size: 15px; color: #d9d9dc; margin-bottom: 18px; }
  .rule { border: 0; border-top: 1px solid var(--line); margin: 22px 0 18px; }
  .specs { display: grid; grid-template-columns: 112px 1fr; row-gap: 12px; column-gap: 18px; font-size: 16px; }
  .specs dt { color: var(--muted); text-align: right; font-size: 13.5px; align-self: center; }
  .specs dd { margin: 0; font-weight: 600; }
  .stock { display: flex; gap: 28px; margin-top: 4px; }
  .stock div { text-align: center; font-size: 13.5px; }
  .stock svg { width: 30px; height: 30px; display: block; margin: 0 auto 8px; }
  .stock .ok { color: var(--ok); }
  .stock .warn { color: var(--warn); }
  .stock .stop { color: var(--stop); }
  .stock .plain { color: var(--text); }
  .tags { margin-top: 26px; font-size: 13.5px; }
  .tags small { color: var(--muted); display: block; margin-bottom: 8px; }
  .tags b { font-family: var(--hdr); font-weight: 700; font-size: 15px; }

  .car { position: relative; display: grid; place-items: center; min-height: 0; }
  .car svg { width: min(100%, 980px); height: auto; filter: drop-shadow(0 40px 30px rgba(0,0,0,.55)); }
  .car .floor {
    position: absolute; left: 10%; right: 10%; bottom: 8%; height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 70%);
    filter: blur(6px); z-index: -1;
  }

  /* ---------- pager row (L1 / R1) ---------- */
  .pager {
    grid-column: 1 / -1;
    display: flex; justify-content: center; align-items: center; gap: 26px;
    font-size: 13px; color: #cfcfd3; padding: 6px 0 4px;
  }
  .pager button { background: none; border: 0; color: #cfcfd3; font: inherit; cursor: pointer; padding: 6px 10px; border-radius: 6px; }
  .pager button:hover, .pager button:focus-visible { background: rgba(255,255,255,.08); outline: none; }
  .dots { display: flex; gap: 22px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.28); display: block; }
  .dots i.on { background: #fff; }

  /* ---------- bottom action bar ---------- */
  .actions {
    display: flex; justify-content: center; gap: 0;
    padding: 6px 20px 26px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.35));
  }
  .action {
    position: relative; width: 176px;
    background: none; border: 0; color: var(--text); font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 14px 8px 10px; border-radius: 10px;
  }
  .action svg { width: 60px; height: 60px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .action span { font-weight: 700; font-size: 16px; }
  .action:hover, .action:focus-visible, .action.active { background: rgba(255,255,255,.08); outline: none; }
  .action.active { box-shadow: inset 0 -3px 0 #fff; }
  .action .n {
    position: absolute; top: 4px; right: 34px; min-width: 26px; height: 22px; padding: 0 7px;
    border-radius: 11px; background: var(--badge); color: #fff;
    font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }

  /* ---------- parts tray (opens above the bar) ---------- */
  .tray {
    position: absolute; left: 480px; right: 40px; bottom: 60px;
    background: rgba(12,12,14,.94); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 22px; display: none; z-index: 5; backdrop-filter: blur(8px);
  }
  .tray.open { display: block; }
  .tray h2 { margin: 0 0 12px; font-family: var(--hdr); font-weight: 700; font-size: 20px; }
  .tray table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tray th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .tray td { padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .tray td.price { text-align: right; font-variant-numeric: tabular-nums; }
  .tray td .ok { color: var(--ok); } .tray td .warn { color: var(--warn); } .tray td .stop { color: var(--stop); }
  .tray .add { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
  .tray .close { position: absolute; top: 12px; right: 14px; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }

  /* ---------- change vehicle overlay ---------- */
  .picker {
    position: fixed; inset: 0; background: rgba(0,0,0,.78); display: none;
    place-items: center; z-index: 20;
  }
  .picker.open { display: grid; }
  .picker .box { width: min(920px, 92vw); }
  .picker h2 { font-weight: 300; font-size: 30px; margin: 0 0 20px; }
  .picker .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .picker .card {
    background: #151517; border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    color: var(--text); text-align: left; cursor: pointer; font: inherit;
  }
  .picker .card:hover, .picker .card:focus-visible { border-color: #fff; outline: none; }
  .picker .card svg { width: 100%; height: auto; margin-bottom: 10px; }
  .picker .card b { display: block; font-family: var(--hdr); font-size: 18px; }
  .picker .card small { color: var(--muted); }

  @media (max-width: 980px) {
    body { overflow: auto; }
    .stage { grid-template-columns: 1fr; padding: 20px 18px 0; }
    .topbar .clock, .topbar .lvl, .topbar .km { display: none; }
    .actions { flex-wrap: wrap; }
    .action { width: 30%; }
    .tray { left: 12px; right: 12px; bottom: 12px; }
    .picker .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .car svg { transition: opacity .25s ease; }
  }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="logo"><span>PG</span></div>
  <div class="cell grow" style="max-width:260px;overflow:hidden">
    <small>Parts Garage</small>
    <b style="font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis">Catalogue: Australian vehicles</b>
  </div>
  <div class="cell">
    <small>Cart total</small>
    <b id="cartTotal">$0.00</b>
  </div>
  <div class="cell vehicle">
    <svg class="thumb" viewBox="0 0 300 120" id="thumb"></svg>
    <div style="min-width:0">
      <div class="name" id="tbName">-</div>
      <div class="sub" id="tbSub">-</div>
    </div>
    <span class="pill" id="tbSku">-</span>
  </div>
  <div class="cell lvl">
    <small>Account level</small>
    <b style="font-size:14px;font-weight:500">Trade customer</b>
  </div>
  <div class="cell km">
    <small>Orders this month</small>
    <b>14</b>
  </div>
  <div class="cell clock">
    <b id="clock">12:44</b>
    <small id="date">Wed 2 Sep</small>
  </div>
</header>

<!-- ============ STAGE ============ -->
<main class="stage">
  <section class="info">
    <h1>Garage</h1>
    <div class="make"><i class="flag" id="flag"></i><span id="make">-</span></div>
    <div class="model" id="model">-</div>
    <div class="colour" id="colour">-</div>
    <span class="pill" id="sku">-</span>
    <hr class="rule">
    <dl class="specs" id="specs"></dl>
    <hr class="rule">
    <div class="stock" id="stock"></div>
    <div class="tags">
      <small>Vehicle type:</small>
      <b id="type">-</b>
    </div>
  </section>

  <section class="car">
    <div class="floor"></div>
    <svg viewBox="0 0 900 380" id="hero" role="img" aria-label="Vehicle illustration"></svg>
  </section>

  <div class="pager">
    <button id="prev" aria-label="Previous vehicle">L1 &#9664;</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Next vehicle">&#9654; R1</button>
  </div>

  <div class="tray" id="tray">
    <button class="close" id="trayClose" aria-label="Close">&times;</button>
    <h2 id="trayTitle">Parts</h2>
    <table>
      <thead><tr><th>Part</th><th>Part number</th><th>Brand</th><th>Stock</th><th style="text-align:right">Price (inc GST)</th><th></th></tr></thead>
      <tbody id="trayBody"></tbody>
    </table>
  </div>
</main>

<!-- ============ BOTTOM ACTION BAR ============ -->
<nav class="actions" id="actions">
  <button class="action" data-cat="change">
    <svg viewBox="0 0 60 60"><path d="M14 42a10 10 0 1 1 14-9l20-20 6 6-4 4-4-4-3 3 4 4-3 3-4-4-8 8a10 10 0 0 1-18 9z"/><circle cx="19" cy="41" r="3"/></svg>
    <span>Change vehicle</span>
  </button>
  <button class="action" data-cat="engine">
    <svg viewBox="0 0 60 60"><path d="M12 24h10l4-6h14l4 6h6v18h-6l-4 6H26l-4-6H12zM6 30h6v6H6zM48 30h6v6h-6zM26 12h10v6"/></svg>
    <span>Engine</span>
  </button>
  <button class="action" data-cat="brakes">
    <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="20"/><circle cx="30" cy="30" r="7"/><path d="M30 10v8M30 42v8M10 30h8M42 30h8"/><path d="M50 16a24 24 0 0 1 0 28" stroke-width="3"/></svg>
    <span>Brakes</span>
  </button>
  <button class="action" data-cat="suspension">
    <svg viewBox="0 0 60 60"><path d="M30 8v6M30 46v6M22 14h16M22 46h16M30 14l-8 6 16 6-16 6 16 6-8 6"/></svg>

  <button class="action" data-cat="body">

  </button>
  <button class="action" data-cat="electrical">
    <svg viewBox="0 0 60 60"><path d="M32 8L16 34h12l-4 18 18-28H30z"/></svg>
    <span>Electrical</span>
  </button>
  <button class="action" data-cat="service">
    <svg viewBox="0 0 60 60"><path d="M18 30l4-12h16l4 12v14H18zM24 18v-6h12v6M18 36h24M26 44v6M34 44v6"/></svg>
    <span>Service &amp; filters</span>
  </button>
  <button class="action" data-cat="cart">
    <svg viewBox="0 0 60 60"><path d="M8 12h8l6 26h26l6-18H20"/><circle cx="25" cy="46" r="4"/><circle cx="45" cy="46" r="4"/></svg>
    <span>Cart</span>
  </button>
</nav>

<!-- ============ CHANGE VEHICLE OVERLAY ============ -->
<div class="picker" id="picker" role="dialog" aria-label="Change vehicle">
  <div class="box">
    <h2>Change vehicle</h2>
    <div class="grid" id="pickerGrid"></div>
  </div>
</div>

  },

const cats = { engine:"Engine", brakes:"Brakes", suspension:"Suspension", body:"Body panels", electrical:"Electrical", service:"Service & filters" };
const stockIcons = {
  engine:`<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 12h5l2-3h7l2 3h3v9h-3l-2 3h-7l-2-3H6zM3 15h3v3H3zM24 15h3v3h-3z"/></svg>`,
  brakes:`<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="15" r="10"/><circle cx="15" cy="15" r="3.5"/></svg>`,
  body:`<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18l3-6h6l3-4h7l3 4h2l1 6z"/><circle cx="9" cy="20" r="2.5"/><circle cx="22" cy="20" r="2.5"/></svg>`,
  electrical:`<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4L8 17h6l-2 9 9-14h-6z"/></svg>`
};

let idx = 0, cart = 0, openCat = null;

function render(){
  const c = cars[idx];
  document.getElementById("flag").className = "flag " + c.flag;
  document.getElementById("make").textContent = c.make;
  document.getElementById("model").textContent = c.model;
  document.getElementById("colour").textContent = c.colour;
  document.getElementById("sku").textContent = c.sku.toLocaleString() + " parts";
  document.getElementById("type").textContent = c.type;
  document.getElementById("specs").innerHTML = c.specs.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  document.getElementById("stock").innerHTML =
    `<div class="plain"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="15" r="10"/><path d="M15 15l5-4"/></svg>${c.sku.toLocaleString()} parts</div>` +
    Object.entries(c.stock).map(([k,s]) => `<div class="${s}">${stockIcons[k]}${S[s]}</div>`).join("");
  document.getElementById("hero").innerHTML = c.draw(c.paint);
  document.getElementById("thumb").innerHTML = c.draw(c.paint);
  document.getElementById("thumb").setAttribute("viewBox","40 60 820 280");
  document.getElementById("tbName").textContent = c.make + " " + c.model;
  document.getElementById("tbSub").textContent = c.specs[2][1] + " / " + c.specs[4][1] + " / " + c.specs[1][1];
  document.getElementById("tbSku").textContent = c.sku.toLocaleString() + " parts";
  document.getElementById("dots").innerHTML = cars.map((_,i) => `<i class="${i===idx?"on":""}"></i>`).join("");
  document.querySelectorAll(".action .n").forEach(n => n.remove());
  document.querySelectorAll(".action[data-cat]").forEach(b => {
    const k = b.dataset.cat;
    if (c.parts[k]) b.insertAdjacentHTML("beforeend", `<em class="n">${c.parts[k].length}</em>`);
    if (k === "cart" && cart > 0) b.insertAdjacentHTML("beforeend", `<em class="n">${cartCount}</em>`);
  });
  if (openCat) showTray(openCat);
}

let cartCount = 0;
function showTray(k){
  const c = cars[idx];
  if (!c.parts[k]) return;
  openCat = k;
  document.getElementById("trayTitle").textContent = `${cats[k]} - ${c.make} ${c.short}`;
  document.getElementById("trayBody").innerHTML = c.parts[k].map(p =>
    `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td><span class="${p[3]}">${S[p[3]]}</span></td><td class="price">${p[4]}</td><td style="text-align:right"><button class="add" data-price="${p[4]}">Add to cart</button></td></tr>`).join("");
  document.getElementById("tray").classList.add("open");
  document.querySelectorAll(".action").forEach(b => b.classList.toggle("active", b.dataset.cat === k));
}
function closeTray(){
  openCat = null;
  document.getElementById("tray").classList.remove("open");
  document.querySelectorAll(".action").forEach(b => b.classList.remove("active"));
}

document.getElementById("actions").addEventListener("click", e => {
  const b = e.target.closest(".action"); if (!b) return;
  const k = b.dataset.cat;
  if (k === "change") { openPicker(); return; }
  if (k === "cart") { closeTray(); alert(cartCount + " item(s) in cart - $" + cart.toFixed(2)); return; }
  openCat === k ? closeTray() : showTray(k);
});
document.getElementById("trayClose").addEventListener("click", closeTray);
document.getElementById("trayBody").addEventListener("click", e => {
  const a = e.target.closest(".add"); if (!a) return;
  cart += parseFloat(a.dataset.price.replace(/[$,]/g,"")); cartCount++;
  document.getElementById("cartTotal").textContent = "$" + cart.toLocaleString("en-AU",{minimumFractionDigits:2});
  a.textContent = "Added"; a.disabled = true;
  render();
});
document.getElementById("prev").addEventListener("click", () => { idx = (idx + cars.length - 1) % cars.length; render(); });
document.getElementById("next").addEventListener("click", () => { idx = (idx + 1) % cars.length; render(); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "Escape") { closeTray(); closePicker(); }
});

function openPicker(){
  document.getElementById("pickerGrid").innerHTML = cars.map((c,i) =>
    `<button class="card" data-i="${i}"><svg viewBox="40 60 820 280">${c.draw(c.paint)}</svg><b>${c.make} ${c.short}</b><small>${c.model}</small></button>`).join("");
  document.getElementById("picker").classList.add("open");
}
function closePicker(){ document.getElementById("picker").classList.remove("open"); }
document.getElementById("pickerGrid").addEventListener("click", e => {
  const b = e.target.closest(".card"); if (!b) return;
  idx = +b.dataset.i; closePicker(); closeTray(); render();
});
document.getElementById("picker").addEventListener("click", e => { if (e.target.id === "picker") closePicker(); });

function tick(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit",hour12:false});
  document.getElementById("date").textContent = d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
}
tick(); setInterval(tick, 30000);
render();
</script>
