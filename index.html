<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carmate — Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0D1114;
    --panel:#171C21;
    --panel-2:#1E252B;
    --hair:#2A3238;
    --paper:#F6F1E4;
    --ash:#8B93A0;
    --signal:#F2B705;
    --signal-deep:#C89404;
    --route:#2F9E74;
    --cyan:#4FD6E0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--paper);
    font-family:'Public Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px; /* room for dock */
  }
  h1,h2,h3,.display{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;
    line-height:0.95;
    margin:0;
  }
  ::selection{background:var(--signal);color:var(--void);}

  /* ---- Top bar ---- */
  .topbar{
    display:flex;flex-direction:column;align-items:flex-start;gap:14px;
    padding:26px 28px 22px;
    border-bottom:1px solid var(--hair);
    background:
      linear-gradient(var(--void),var(--void)),
      repeating-linear-gradient(0deg, rgba(79,214,224,0.035) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(79,214,224,0.035) 0 1px, transparent 1px 26px);
  }
  .brand-mini{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:13px;
    color:var(--signal);letter-spacing:0.08em;margin-bottom:-6px;
  }
  .garage-word{
    font-size:30px;letter-spacing:0.01em;color:var(--cyan);
  }

  .plate-entry{display:flex;align-items:center;gap:10px;}
  .plate-mini{
    display:flex;background:var(--paper);border-radius:5px;overflow:hidden;
    box-shadow:0 0 0 1px var(--hair), 0 0 18px rgba(79,214,224,0.12);
  }
  .plate-mini .marque{
    background:var(--route);color:#fff;font-family:'Big Shoulders Display';font-weight:800;
    font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 6px;
  }
  #regoInput{
    border:none;outline:none;background:var(--paper);color:var(--void);
    font-family:'Space Mono',monospace;font-weight:700;font-size:16px;letter-spacing:0.1em;
    text-align:center;padding:9px 10px;width:120px;text-transform:uppercase;
  }
  #regoInput::placeholder{color:#B7B2A4;}
  .lookup-btn{
    background:var(--signal);color:var(--void);border:none;border-radius:5px;
    font-family:'Public Sans',sans-serif;font-weight:700;font-size:13px;
    padding:10px 18px;cursor:pointer;white-space:nowrap;
    box-shadow:0 0 16px rgba(242,183,5,0.25);
    transition:box-shadow 0.15s ease;
  }
  .lookup-btn:hover{background:var(--signal-deep);box-shadow:0 0 22px rgba(242,183,5,0.4);}
  .lookup-btn:disabled{background:var(--hair);color:var(--ash);cursor:default;box-shadow:none;}

  .shell{max-width:1100px;margin:0 auto;padding:0 28px;}
  .status-line{font-size:12px;color:var(--ash);text-align:left;padding:0 28px;min-height:18px;}
  .road-loader{
    display:inline-block;width:28px;height:3px;border-radius:2px;
    background-image:repeating-linear-gradient(90deg,var(--signal) 0 5px,transparent 5px 10px);
    background-size:200% 100%;animation:roll 0.7s linear infinite;vertical-align:middle;margin-right:6px;
  }
  @keyframes roll{from{background-position:0 0;}to{background-position:-20px 0;}}

  /* ---- Idle state ---- */
  .idle{
    text-align:left;padding:70px 0;color:var(--ash);
  }
  .idle h2{font-size:32px;color:var(--paper);margin-bottom:10px;}
  .idle p{font-size:14px;max-width:340px;margin:0;}
  .idle strong{color:var(--signal);}

  .not-found{display:none;text-align:left;padding:70px 0;}
  .not-found.show{display:block;}
  .not-found h2{font-size:28px;color:var(--paper);margin-bottom:8px;}
  .not-found p{color:var(--ash);font-size:14px;}
  .not-found strong{color:var(--signal);}

  /* ---- Garage view ---- */
  .garage{display:none;padding:40px 0 20px;}
  .garage.show{display:block;}
  .garage-grid{
    display:grid;grid-template-columns:280px 1fr;gap:30px;align-items:end;
  }
  @media (max-width:800px){.garage-grid{grid-template-columns:1fr;}}

  .spec-col{display:flex;flex-direction:column;gap:2px;}
  .brand-row{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .brand-dot{
    width:20px;height:20px;border-radius:5px;background:var(--cyan);
    display:flex;align-items:center;justify-content:center;
  }
  .brand-dot svg{width:11px;height:11px;fill:var(--void);}
  .brand-name{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:0.06em;}
  .vname{font-size:26px;color:var(--paper);line-height:1.15;margin-bottom:4px;}
  .vyear{color:var(--paper);font-size:14px;font-weight:700;margin-bottom:4px;}
  .vcolour{color:var(--ash);font-size:13px;margin-bottom:14px;}
  .vplate-chip{
    display:inline-flex;align-items:center;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;
    color:var(--paper);border:1.5px solid var(--hair);padding:6px 16px;border-radius:999px;
    letter-spacing:0.1em;margin-bottom:22px;width:fit-content;
  }

  .spec-list{border-top:1px solid var(--hair);padding-top:2px;margin-bottom:18px;}
  .spec-row{
    display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair);
    font-size:13px;
  }
  .spec-row .k{color:var(--ash);}
  .spec-row .v{color:var(--paper);font-weight:700;font-size:13px;}

  .status-row{display:flex;align-items:center;gap:22px;margin-bottom:16px;}
  .status-item{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .status-item svg{width:20px;height:20px;stroke:var(--ash);fill:none;stroke-width:1.6;}
  .status-item span{font-size:11px;color:var(--ash);}
  .status-item.good svg{stroke:var(--route);}
  .status-item.good span{color:var(--route);}

  .type-row{font-size:12px;color:var(--ash);}
  .type-row .tag{background:none;padding:0;color:var(--paper);font-weight:600;}

  /* ---- Hero illustration ---- */
  .hero-stage{
    position:relative;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(79,214,224,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(79,214,224,0.05) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(79,214,224,0.05) 0 1px, transparent 1px 22px),
      var(--panel);
    border-radius:6px;
    padding:30px;
    min-height:320px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .hero-stage::before{
    content:'';position:absolute;left:0;right:0;bottom:38px;height:1px;
    background:linear-gradient(90deg,transparent,var(--hair) 20%,var(--hair) 80%,transparent);
  }
  .hero-stage svg{width:100%;max-width:420px;filter:drop-shadow(0 22px 18px rgba(0,0,0,0.5));}
  .hud-corner{position:absolute;width:22px;height:22px;border-color:var(--cyan);opacity:0.65;}
  .hud-corner.tl{top:10px;left:10px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);}
  .hud-corner.tr{top:10px;right:10px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);}
  .hud-corner.bl{bottom:10px;left:10px;border-bottom:2px solid var(--cyan);border-left:2px solid var(--cyan);}
  .hud-corner.br{bottom:10px;right:10px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);}
  .hud-label{
    position:absolute;top:14px;left:38px;font-family:'Space Mono',monospace;
    font-size:10px;color:var(--cyan);opacity:0.7;letter-spacing:0.08em;
  }

  /* ---- Dock ---- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--panel);border-top:1px solid var(--hair);
    display:flex;justify-content:center;gap:6px;
    padding:10px 14px;z-index:10;
    overflow-x:auto;
  }
  .dock-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--ash);cursor:pointer;
    padding:8px 16px;border-radius:8px;font-family:'Public Sans',sans-serif;font-size:11px;
    min-width:64px;
  }
  .dock-btn svg{width:22px;height:22px;stroke:var(--ash);fill:none;stroke-width:1.6;}
  .dock-btn.active{color:var(--signal);background:var(--panel-2);}
  .dock-btn.active svg{stroke:var(--signal);}
  .dock-btn:disabled{opacity:0.35;cursor:default;}

  /* ---- Parts panel ---- */
  .parts-section{display:none;padding:8px 0 40px;}
  .parts-section.show{display:block;}
  .parts-heading{font-size:24px;color:var(--paper);margin-bottom:16px;}
  .search-row{margin-bottom:14px;}
  #partSearch{
    width:100%;background:var(--panel);border:1px solid var(--hair);
    color:var(--paper);border-radius:8px;padding:12px 16px;
    font-family:'Public Sans',sans-serif;font-size:15px;outline:none;
  }
  #partSearch:focus{border-color:var(--signal);}
  #partSearch::placeholder{color:var(--ash);}

  .parts-list{display:flex;flex-direction:column;gap:10px;}
  .part-row{background:var(--panel);border-radius:10px;padding:16px 18px;}
  .part-row-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .part-name{font-size:16px;color:var(--paper);font-weight:600;}
  .part-sku{display:block;font-family:'Space Mono',monospace;font-size:11px;color:var(--ash);margin-top:3px;}
  .part-price{font-family:'Space Mono',monospace;font-size:13px;color:var(--ash);white-space:nowrap;}
  .search-part-btn{
    background:transparent;color:var(--signal);border:1.5px solid var(--signal);
    border-radius:999px;padding:8px 18px;font-weight:700;font-size:13px;
    font-family:'Public Sans',sans-serif;cursor:pointer;white-space:nowrap;
  }
  .search-part-btn:hover{background:var(--signal);color:var(--void);}
  .search-part-btn:disabled{opacity:0.5;cursor:default;}
  .no-results{padding:20px;text-align:center;color:var(--ash);font-size:14px;}

  .part-results{display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--hair);}
  .part-results.show{display:block;}
  .results-loading{font-size:13px;color:var(--ash);display:flex;align-items:center;}
  .results-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media (max-width:700px){.results-groups{grid-template-columns:1fr;}}
  .tag{position:relative;background:var(--paper);color:var(--void);border-radius:4px 10px 10px 4px;padding:14px 14px 14px 20px;}
  .tag::before{content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--void);}
  .tag-source{font-size:11px;font-weight:700;color:var(--route);margin-bottom:8px;}
  .listing{padding:8px 0;border-top:1px dashed #E8E1CC;}
  .listing:first-of-type{border-top:none;padding-top:0;}
  .listing-title{display:block;font-size:13px;font-weight:600;line-height:1.35;}
  .listing-meta{display:block;font-size:11px;color:#6B6656;margin-top:2px;}
  .listing-price{font-family:'Space Mono',monospace;font-weight:700;font-size:16px;margin-top:6px;display:block;}
  .listing-link{font-size:12px;color:var(--route);font-weight:700;text-decoration:none;}
  .listing-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand-mini">Carmate</div>

</div>
<div class="status-line" id="statusLine"></div>

<div class="shell">

          <rect x="60" y="150" width="30" height="10" rx="2" fill="var(--signal)" opacity="0.85"/>
          <rect x="405" y="150" width="26" height="9" rx="2" fill="var(--cyan)" opacity="0.7"/>
          <circle cx="141" cy="178" r="26" fill="#0D1114" stroke="#3A444D" stroke-width="3"/>
          <circle cx="141" cy="178" r="11" fill="#3A444D"/>

          <circle cx="396" cy="178" r="11" fill="#3A444D"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="parts-section" id="partsSection">
    <h2 class="parts-heading" id="partsHeading">Parts</h2>
    <div class="search-row">
      <input id="partSearch" placeholder="Search parts — brakes, filter, battery…" autocomplete="off">
    </div>
    <div class="parts-list" id="partsList"></div>
  </div>
</div>

<div class="dock" id="dock"></div>

  "All": '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  "Brakes": '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>',
  "Suspension": '<svg viewBox="0 0 24 24"><path d="M8 3v4M16 17v4M8 7c0 2 2 2 2 4s-2 2-2 4M16 7c0 2 2 2 2 4s-2 2-2 4"/></svg>',
  "Electrical": '<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  "Filters": '<svg viewBox="0 0 24 24"><path d="M4 4h16l-6 8v6l-4 2v-8z"/></svg>',
  "Tyres": '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>'
};
const CATS = { ute: ["All", "Brakes", "Suspension", "Electrical", "Filters", "Tyres"] };

let currentVehicle = null;
let activeCat = "All";

const regoInput = document.getElementById('regoInput');
const lookupBtn = document.getElementById('lookupBtn');
const statusLine = document.getElementById('statusLine');
const idleState = document.getElementById('idleState');
const notFoundBox = document.getElementById('notFoundBox');
const garageView = document.getElementById('garageView');
const partsSection = document.getElementById('partsSection');
const dock = document.getElementById('dock');

function doLookup(){
  const plate = regoInput.value.trim().toUpperCase();
  if(!plate) return;
  garageView.classList.remove('show');
  notFoundBox.classList.remove('show');
  idleState.style.display = 'none';
  partsSection.classList.remove('show');
  lookupBtn.disabled = true;
  statusLine.innerHTML = '<span class="road-loader"></span>Checking registration…';

  setTimeout(() => {
    lookupBtn.disabled = false;
    const v = VEHICLES[plate];
    if(v){
      currentVehicle = v;
      statusLine.textContent = '';
      document.getElementById('vBrand').textContent = v.make;
      document.getElementById('vModel').textContent = v.model + ' — ' + v.variant;
      document.getElementById('vYear').textContent = "'" + String(v.year).slice(-2);
      document.getElementById('vColour').textContent = 'Base colour: ' + v.colour;
      document.getElementById('vPlate').textContent = plate;
      document.getElementById('vType').textContent = '#' + v.category.toUpperCase();

      const specs = [
        ['Engine', v.engine], ['Drivetrain', v.drivetrain],
        ['Max power', v.power], ['Max torque', v.torque],
        ['Weight', v.weight], ['Fuel type', v.fuel]
      ];
      document.getElementById('specList').innerHTML = specs.map(([k,val]) =>
        `<div class="spec-row"><span class="k">${k}</span><span class="v">${val}</span></div>`
      ).join('');

      const odoIcon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>';
      const regoIcon = '<svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>';
      document.getElementById('statusRow').innerHTML = `
        <div class="status-item"><span>${odoIcon}</span><span>${v.odo}</span></div>
        <div class="status-item good"><span>${regoIcon}</span><span>Rego valid</span></div>
      `;

      garageView.classList.add('show');
      buildDock();
      renderParts();
    } else {
      currentVehicle = null;
      notFoundBox.classList.add('show');
    }
  }, 850);
}

lookupBtn.addEventListener('click', doLookup);
regoInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLookup(); });

function buildDock(){
  const cat = currentVehicle.category;
  dock.innerHTML = '';
  activeCat = "All";
  CATS[cat].forEach(c => {
    const b = document.createElement('button');
    b.className = 'dock-btn' + (c === 'All' ? ' active' : '');
    b.innerHTML = (CATEGORY_ICONS[c] || CATEGORY_ICONS['All']) + `<span>${c}</span>`;
    b.addEventListener('click', () => {
      activeCat = c;
      document.querySelectorAll('.dock-btn').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      filterAndRender();
      partsSection.scrollIntoView({behavior:'smooth', block:'start'});
    });
    dock.appendChild(b);
  });
}

function renderParts(){
  document.getElementById('partsHeading').textContent = 'Parts for your ' + currentVehicle.make + ' ' + currentVehicle.model;
  document.getElementById('partSearch').value = '';
  document.getElementById('partSearch').oninput = filterAndRender;
  filterAndRender();
  partsSection.classList.add('show');
}

function filterAndRender(){
  const q = document.getElementById('partSearch').value.toLowerCase();
  const cat = currentVehicle.category;
  const list = PARTS[cat].filter(p => {
    const matchesText = p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
    const matchesCat = activeCat === 'All' || TAG_CAT[p.sku] === activeCat;
    return matchesText && matchesCat;
  });
  const listEl = document.getElementById('partsList');
  if(list.length === 0){
    listEl.innerHTML = '<div class="no-results">No parts match that search.</div>';
    return;
  }
  listEl.innerHTML = '';
  list.forEach(p => {
    const row = document.createElement('div');
    row.className = 'part-row';
    row.innerHTML = `
      <div class="part-row-top">
        <div>
          <span class="part-name">${p.name}</span>
          <span class="part-sku">${p.sku}</span>
        </div>
        <span class="part-price">from ${p.price}</span>
        <button type="button" class="search-part-btn">Search</button>
      </div>
      <div class="part-results"></div>
    `;
    const searchBtn = row.querySelector('.search-part-btn');
    const resultsEl = row.querySelector('.part-results');
    searchBtn.addEventListener('click', () => {
      if(resultsEl.classList.contains('show')){
        resultsEl.classList.remove('show');
        searchBtn.textContent = 'Search';
        return;
      }
      searchBtn.textContent = 'Hide';
      resultsEl.classList.add('show');
      resultsEl.innerHTML = `<div class="results-loading"><span class="road-loader"></span>Searching eBay, Repco &amp; Supercheap Auto…</div>`;
      searchBtn.disabled = true;
      setTimeout(() => {
        renderPartResults(resultsEl, p);
        searchBtn.disabled = false;
      }, 750);
    });
    listEl.appendChild(row);
  });
}

function renderPartResults(container, part){
  const data = RESULTS[part.sku] || {};
  const ebaySearchUrl = 'https://www.ebay.com.au/sch/i.html?_nkw=' + encodeURIComponent(part.name + ' ' + currentVehicle.make + ' ' + currentVehicle.model);
  const repcoSearchUrl = 'https://www.repco.com.au/search?text=' + encodeURIComponent(part.name);
  const supercheapSearchUrl = 'https://www.supercheapauto.com.au/search?q=' + encodeURIComponent(part.name);

  const buildTag = (source, items, url, linkLabel) => {
    const listings = (items || []).map(l => `
      <div class="listing">
        <span class="listing-title">${l.title}</span>
        <span class="listing-meta">${l.meta}</span>
        <span class="listing-price">${l.price}</span>
        <a class="listing-link" href="${url}" target="_blank" rel="noopener">${linkLabel}</a>
      </div>
    `).join('') || '<div class="no-results" style="padding:8px 0;">No listings found.</div>';
    return `<div class="tag"><div class="tag-source">${source}</div>${listings}</div>`;
  };

  container.innerHTML = `
    <div class="results-groups">
      ${buildTag('eBay', data.ebay, ebaySearchUrl, 'Open on eBay')}
      ${buildTag('Repco', data.repco, repcoSearchUrl, 'Open on Repco')}
      ${buildTag('Supercheap Auto', data.supercheap, supercheapSearchUrl, 'Open on Supercheap')}
    </div>
  `;
}
</script>
</body>
</html>
